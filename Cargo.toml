[package]
name = "typesafe-ai"
version = "0.1.0"
edition = "2024"
description = "Score text for personal health information with TypeSafe AI"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usage = { package = "usage-rs", version = "6" }
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
