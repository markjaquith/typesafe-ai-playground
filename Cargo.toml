[package]
name = "typesafe-ai"
version = "0.1.0"
edition = "2024"
description = "Score text for personal health information with TypeSafe AI"
license = "MIT"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usage = { package = "usage-rs", version = "6" }
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
crossterm = "0.28"
ratatui = "0.29"
syntect = "5"
two-face = "0.5"
tiny_http = "0.12"
tiktoken-rs = "0.12"
unicode-segmentation = "1.12"

[dev-dependencies]
scraper = "0.24"
tempfile = "3"
